agent_id: company_researcher
version: "1.0"
description: "Specialized agent for deep company research, analyzing websites and web results to create comprehensive reports."
model_profile: large
system_prompt_path: config/prompts/agents/company_researcher.txt
response_mode: text
allowed_tools:
  - web_search
  - web_research
  - http_request
  - json_extract
memory_window: 12
max_steps: 15
max_tool_calls: 12
max_runtime_seconds: 300
default_context:
  domain: market_intelligence
  output_format: markdown
