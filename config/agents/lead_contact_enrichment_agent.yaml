agent_id: lead_contact_enrichment_agent
version: "1.0"
description: "Phase 2 lead-gen agent that enriches discovered companies with people and contact paths."
model_profile: large
system_prompt_path: config/prompts/agents/lead_contact_enrichment_agent.txt
response_mode: json
allowed_tools:
  - linkedin_research
  - google_contacts_search
  - web_research
  - http_request
  - lead_quality_check
  - json_extract
memory_window: 8
max_steps: 28
max_tool_calls: 22
max_runtime_seconds: 300
default_context:
  output_format: json
  allow_fallback_contacts: true
  minimum_confidence_floor: low
output_schema:
  type: object
  properties:
    leads:
      type: array
      items:
        type: object
        properties:
          company_name: { type: string }
          company_website: { type: string }
          industry: { type: string }
          location: { type: string }
          value_proposition: { type: string }
          company_size: { type: string }
          contact_person_name: { type: string }
          founder_name: { type: string }
          contact_person_title: { type: string }
          contact_email: { type: string }
          contact_phone: { type: string }
          linkedin_url: { type: string }
          contact_page: { type: string }
          source: { type: string }
          confidence:
            type: string
            enum: [high, medium, low]
        required: [company_name, company_website]
  required: [leads]
