agent_id: lead_gen_agent
version: "1.0"
description: "High-coverage B2B lead generation agent that discovers companies, finds relevant people, and returns structured outreach contacts."
model_profile: small
system_prompt_path: config/prompts/agents/lead_gen_agent.txt
response_mode: json
allowed_tools:
  - web_search
  - linkedin_research
  - google_contacts_search
  - http_request
  - lead_quality_check
  - json_extract
memory_window: 10
max_steps: 50
max_tool_calls: 16
max_runtime_seconds: 300
default_context:
  domain: sales_intelligence
  output_format: json
  target_lead_count: 15
  target_company_pool: 30
  search_expansion_enabled: true
  search_retry_attempts: 2
  allow_fallback_contacts: true
  allow_apollo_enrichment: false
  allow_google_contacts_enrichment: true
  split_workflow_id: lead_generation_split_pipeline
  minimum_confidence_floor: low
output_schema:
  type: object
  properties:
    leads:
      type: array
      items:
        type: object
        properties:
          company_name: { type: string }
          company_website: { type: string }
          industry: { type: string }
          location: { type: string }
          value_proposition: { type: string }
          company_size: { type: string }
          contact_person_name: { type: string }
          founder_name: { type: string }
          contact_person_title: { type: string }
          contact_email: { type: string }
          contact_phone: { type: string }
          linkedin_url: { type: string }
          contact_page: { type: string }
          source: { type: string }
          confidence:
            type: string
            enum: [high, medium, low]
        required: [company_name, company_website]
  required: [leads]
